name: Publication

# Construit l'application et la publie dans le dépôt public de distribution
# (MagicCode666/MarniarauCrypto-dist), servi par GitHub Pages. Le code reste dans le dépôt privé.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    name: Build et publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Publier dans le dépôt de distribution
        env:
          DIST_DEPLOY_TOKEN: ${{ secrets.DIST_DEPLOY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DIST_DEPLOY_TOKEN" ]; then
            echo "::warning::Secret DIST_DEPLOY_TOKEN absent : rien n'est publié."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${DIST_DEPLOY_TOKEN}@github.com/MagicCode666/MarniarauCrypto-dist.git" site
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. site/
          touch site/.nojekyll
          cd site
          git config user.name "Nico"
          git config user.email "267872670+MagicCode666@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Publication ${SHA::7}"
          git push origin HEAD:main
